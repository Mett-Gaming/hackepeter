[package]
name = "hackepeter"
version = "0.1.0"
edition = "2021"
description = "HACKEPETER - Die Mettbroetchen-Flucht: Endless-Runner, Dieb gegen Ordnungsamt (bis 8 Spieler)"

[workspace]
members = [".", "mettgine", "mettgine/mpak", "mettgine/mettpack"]
# `cargo test` prueft Spiel und Engine
default-members = [".", "mettgine", "mettgine/mpak", "mettgine/mettpack"]

[dependencies]
mettgine = { path = "mettgine" }
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rand = "0.8"
rand_pcg = "0.3"

[profile.release]
# Zeilennummern fuer Absturzberichte (landen in hackepeter.pdb neben der exe, nicht in der exe)
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
